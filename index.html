<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Web Audio</h1>

        <div class="bgcover">
            <img
                src="3dcbc2ba6a3f6ded21c66f23b1b9b2cb.gif"
                alt="Animated background"
                id="hp"
            >
        </div>

        <div class="audio">
            <p>My Music Player</p>

            <video
                id="music"
                controls
                playsinline
                preload="metadata"
            >
                <source
                    src="tiktokio.com1791624564_As9WG2zSaHFATnjf2Crx.mp4"
                    type="video/mp4"
                >
                Your browser does not support video playback.
            </video>

            <div class="playback">
                <button onclick="rewind()">⏪ 10s</button>
                <button onclick="playPause()" id="playBtn">Play</button>
                <button onclick="forward()">10s ⏩</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById("music");
        const playBtn = document.getElementById("playBtn");

        function playPause() {
            if (video.paused) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        }

        function rewind() {
            video.currentTime = Math.max(0, video.currentTime - 10);
        }

        function forward() {
            if (Number.isFinite(video.duration)) {
                video.currentTime = Math.min(
                    video.duration,
                    video.currentTime + 10
                );
            }
        }

        video.addEventListener("play", () => {
            playBtn.textContent = "Pause";
        });

        video.addEventListener("pause", () => {
            playBtn.textContent = "Play";
        });

        video.addEventListener("ended", () => {
            playBtn.textContent = "Play";
        });
    </script>
</body>
</html>
